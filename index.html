<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bakery Order</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f4f7fb;color:#172033;margin:0}
    main{max-width:780px;margin:24px auto;padding:0 16px}
    .card{background:#fff;border:1px solid #dce3ee;border-radius:12px;padding:20px;margin:14px 0}
    h1{color:#153d67} h2{font-size:18px}
    label{display:block;font-size:13px;font-weight:bold;margin:10px 0 5px}
    input,select,button{font:inherit;box-sizing:border-box}
    input,select{width:100%;padding:10px;border:1px solid #bfc9d8;border-radius:7px}
    button{padding:10px 14px;border:0;border-radius:7px;background:#153d67;color:#fff;font-weight:bold;cursor:pointer;margin:10px 5px 0 0}
    button.secondary{background:#64748b}.hidden{display:none}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
    .items{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
    .item{border:1px solid #dce3ee;border-radius:8px;padding:10px}
    .row{padding:10px 0;border-bottom:1px solid #e5eaf1}
    .error{color:#b42318}.success{color:#147a42}.muted{color:#64748b;font-size:13px}
  </style>
</head>
<body>
<main>
  <h1>Bakery Order</h1>

  <section id="loginCard" class="card">
    <h2>Sign in</h2>

    <div class="grid">
      <div>
        <label>Name</label>
        <input id="name" maxlength="80">
      </div>
      <div>
        <label>Phone</label>
        <input id="phone" inputmode="numeric" maxlength="12">
      </div>
    </div>

    <label>Access password</label>
    <input id="accessPassword" type="password">

    <button onclick="signIn()">Sign in</button>
    <p id="loginMessage" class="error"></p>
  </section>

  <section id="app" class="hidden">
    <section class="card">
      <p id="user" class="muted"></p>
      <h2>New order</h2>

      <div class="grid">
        <div>
          <label>Branch</label>
          <select id="branch"></select>
        </div>
        <div>
          <label>Order date</label>
          <input id="orderDate" type="date">
        </div>
        <div>
          <label>Pickup time</label>
          <input id="pickupTime" placeholder="08:30 AM">
        </div>
      </div>

      <label>Ordered by</label>
      <input id="orderedBy" readonly>

      <div id="items" class="items"></div>

      <p><b>Total quantity: <span id="total">0</span></b></p>
      <button id="submitButton" onclick="placeOrder()">Place order</button>
      <p id="orderMessage"></p>
    </section>

    <section class="card">
      <h2>Recent orders</h2>
      <button class="secondary" onclick="loadHistory()">Refresh</button>
      <div id="history" class="muted">No history loaded.</div>
    </section>

    <section class="card">
      <h2>Admin report</h2>
      <button class="secondary" onclick="unlockAdmin()">Unlock export</button>

      <div id="adminPanel" class="hidden">
        <div class="grid">
          <div>
            <label>Start date</label>
            <input id="startDate" type="date">
          </div>
          <div>
            <label>End date</label>
            <input id="endDate" type="date">
          </div>
        </div>

        <button onclick="exportReport()">Download CSV report</button>
      </div>
    </section>

    <button class="secondary" onclick="signOut()">Sign out</button>
  </section>
</main>

<script>
  /* Replace this with your Cloudflare Worker URL. */
  const WORKER_URL = 'https://YOUR-WORKER.YOUR-SUBDOMAIN.workers.dev';

  const SESSION_KEY = 'bakery_session_token';
  let token = sessionStorage.getItem(SESSION_KEY) || '';
  let config = null;

  function byId(id) {
    return document.getElementById(id);
  }

  async function api(action, payload = {}) {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action,
        ...payload
      })
    });

    const result = await response.json();

    if (!result.ok) {
      throw new Error(result.message || 'Request failed.');
    }

    return result;
  }

  function showMessage(id, text, success = false) {
    const el = byId(id);
    el.textContent = text || '';
    el.className = success ? 'success' : 'error';
  }

  function escapeHtml(value) {
    const div = document.createElement('div');
    div.textContent = String(value ?? '');
    return div.innerHTML;
  }

  function today() {
    return new Date().toLocaleDateString('en-CA', {
      timeZone: 'Asia/Phnom_Penh'
    });
  }

  function createOrderId() {
    if (crypto.randomUUID) {
      return crypto.randomUUID().replace(/-/g, '');
    }

    return Date.now().toString(36) +
      Math.random().toString(36).slice(2) +
      Math.random().toString(36).slice(2);
  }

  async function signIn() {
    showMessage('loginMessage', '');

    try {
      const result = await api('login', {
        name: byId('name').value,
        phone: byId('phone').value,
        password: byId('accessPassword').value
      });

      token = result.token;
      sessionStorage.setItem(SESSION_KEY, token);
      byId('accessPassword').value = '';

      await startApp();
    } catch (error) {
      showMessage('loginMessage', error.message);
    }
  }

  async function startApp() {
    try {
      config = await api('config', { token });

      byId('loginCard').classList.add('hidden');
      byId('app').classList.remove('hidden');

      byId('user').textContent =
        'Signed in as ' + config.user.name;

      byId('orderedBy').value =
        config.user.name + ' (' + config.user.phone + ')';

      byId('branch').innerHTML = config.branches
        .map(branch =>
          `<option value="${escapeHtml(branch)}">${escapeHtml(branch)}</option>`
        )
        .join('');

      byId('orderDate').min = today();
      byId('orderDate').value = today();

      byId('items').innerHTML = config.items
        .map((item, index) => `
          <div class="item">
            <label>${escapeHtml(item)}</label>
            <input
              type="number"
              min="0"
              max="${config.maxPerItem}"
              value="0"
              data-item="${index}"
              oninput="updateTotal()">
          </div>
        `)
        .join('');

      updateTotal();
      loadHistory();
    } catch (error) {
      token = '';
      sessionStorage.removeItem(SESSION_KEY);
      showMessage('loginMessage', 'Session expired. Please sign in again.');
    }
  }

  function updateTotal() {
    const total = [...document.querySelectorAll('[data-item]')]
      .reduce((sum, input) => sum + (Number(input.value) || 0), 0);

    byId('total').textContent = total;
  }

  async function placeOrder() {
    const button = byId('submitButton');
    button.disabled = true;
    showMessage('orderMessage', 'Submitting…', true);

    const payload = {
      token,
      clientOrderId: createOrderId(),
      branch: byId('branch').value,
      orderDate: byId('orderDate').value,
      pickupTime: byId('pickupTime').value,
      items: [...document.querySelectorAll('[data-item]')]
        .map(input => Number(input.value) || 0)
    };

    try {
      const result = await api('submitOrder', payload);

      showMessage(
        'orderMessage',
        (result.duplicate ? 'Already received: ' : 'Order sent: ') +
        result.doNo,
        true
      );

      document
        .querySelectorAll('[data-item]')
        .forEach(input => input.value = 0);

      updateTotal();
      loadHistory();
    } catch (error) {
      showMessage('orderMessage', error.message);
    } finally {
      button.disabled = false;
    }
  }

  async function loadHistory() {
    const history = byId('history');
    history.textContent = 'Loading…';

    try {
      const result = await api('history', { token });

      history.innerHTML = result.orders.length
        ? result.orders.map(order => `
            <div class="row">
              <b>${escapeHtml(order.doNo)}</b> —
              ${escapeHtml(order.branch)}<br>
              <span class="muted">
                ${escapeHtml(order.orderDate)}
                ${escapeHtml(order.pickupTime)}
                · Qty ${order.totalQty}
                · ${escapeHtml(order.orderedBy)}
              </span>
            </div>
          `).join('')
        : 'No orders yet.';
    } catch (error) {
      history.textContent = error.message;
    }
  }

  async function unlockAdmin() {
    const password = prompt('Admin password');

    if (password === null) return;

    try {
      await api('admin', { token, password });

      byId('adminPanel').classList.remove('hidden');
      byId('startDate').value = today();
      byId('endDate').value = today();
    } catch (error) {
      alert(error.message);
    }
  }

  function csvCell(value) {
    let text = String(value ?? '');

    /* Blocks Excel/CSV formula injection. */
    if (/^[=+\-@]/.test(text)) {
      text = "'" + text;
    }

    return '"' + text.replace(/"/g, '""') + '"';
  }

  async function exportReport() {
    try {
      const result = await api('report', {
        token,
        startDate: byId('startDate').value,
        endDate: byId('endDate').value,
        branch: 'ALL'
      });

      const header = [
        'DO Number', 'Branch', 'Order Date', 'Pickup Time',
        'Ordered By', ...config.items,
        'Total Qty', 'Total Amount', 'Version'
      ];

      const csv = [
        header.map(csvCell).join(','),
        ...result.orders.map(order => [
          order.doNo,
          order.branch,
          order.orderDate,
          order.pickupTime,
          order.orderedBy,
          ...order.items,
          order.totalQty,
          order.totalAmount,
          order.version
        ].map(csvCell).join(','))
      ].join('\n');

      const blob = new Blob([csv], {
        type: 'text/csv;charset=utf-8'
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');

      link.href = url;
      link.download =
        `Bakery_${byId('startDate').value}_${byId('endDate').value}.csv`;

      link.click();
      URL.revokeObjectURL(url);
    } catch (error) {
      alert(error.message);
    }
  }

  async function signOut() {
    try {
      await api('logout', { token });
    } catch (_) {}

    sessionStorage.removeItem(SESSION_KEY);
    location.reload();
  }

  if (token) {
    startApp();
  }
</script>
</body>
</html>
